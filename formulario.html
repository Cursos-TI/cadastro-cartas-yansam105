<!DOCTYPE html>
<html>
<head>
</head>
<body>

   <form action="/pagina-processa-dados-do-form" method="post">
<fieldset>
<legend> Dados Gerais</legend>

<label for="Nome"> NOME: </label>
<input type="text" minlength="3"
id="Nome" />
<label for="Data_de_nascimento">Data de nascimento:</label>
<input type="text"
id="Data_de_nascimento" />
<label for="cpf"> CPF:</label>
<input type="text" minlength="11"
id="CPF" />
</fieldset>

<fieldset>
<legend>ENDEREÇO</legend>

<label for="tipo_endereço">TIPO:</label>
<select id="tipo_endereço">
<option value="">Selecione</option>
<option value="">Rua</option>
<option value="">Rodovia</option>
<option value="">Estrada</option>
</select>

<label for="Logradouro_endereço"> Logradouro:</label>
<input type="text"
id="Logradouro_endereço" />

<label for="Numero_endereço"> ENDEREÇO:</label>
<input type="text"
id="Numero_endereço" />

<label for="complemento_endereço"> COMPLEMENTO: </label>
<input type="text"
id="complemento_endereço" />
</fieldset>

<fieldset>
<legend> MENSAGEM </legend>
<label for="msg"> MENSAGEM </label>
<textarea id="msg">
</textarea>

<fieldset>
<button type="submit"> ENVIAR MENSAGEM </button>
<button type="reset"> LIMPAR FORMULARIO </button>
</fieldset>
</fieldset>
</form>


</body>
</html>
